name: 📖 User Story
description: Eine neue User Story für den Product Backlog
title: "[STORY] "
labels: ["user-story", "backlog"]
body:
  - type: textarea
    id: story
    attributes:
      label: User Story
      description: "Format: Als [Rolle] möchte ich [Ziel], damit [Nutzen]"
      placeholder: "Als Nutzer möchte ich ..., damit ich ..."
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Akzeptanzkriterien
      description: Wann gilt die Story als "Done"?
      placeholder: |
        - [ ] Kriterium 1
        - [ ] Kriterium 2
    validations:
      required: true

  - type: dropdown
    id: story-points
    attributes:
      label: Story Points
      options: ["1", "2", "3", "5", "8", "13", "21"]
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priorität
      options: ["Muss", "Sollte", "Kann", "Nice-to-have"]
    validations:
      required: true

  - type: input
    id: sprint
    attributes:
      label: Sprint
      placeholder: "z.B. Sprint 12 oder Backlog"
